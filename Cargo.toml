[package]
name = "oko"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
libc = "0.2"
prost = "0.14"
ratatui = "0.30"
serde_json = "1"
# Already in the lock file through ratatui-widgets, so this asks for two features and no
# new crate. RFC-3339 in and out of the status file, rather than hand-rolled calendar maths.
time = { version = "0.3", features = ["formatting", "parsing"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

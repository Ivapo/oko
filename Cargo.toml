[package]
name = "oko"
version = "0.1.0"
edition = "2024"
description = "\"The eye\" — a live dashboard tab inside iTerm2 showing what every other tab in the window is doing, with Enter to jump to one."
repository = "https://github.com/Ivapo/oko"
license = "MIT"
readme = "README.md"
keywords = ["iterm2", "tui", "dashboard", "claude-code", "ratatui"]
categories = ["command-line-utilities"]
# `license` covers Oko's own source. `proto/api.proto` is vendored from iTerm2 and is
# GPL-2.0 — see proto/NOTICE.md. It cannot be dropped: build.rs compiles it, and it is the
# wire format a client must speak. Read that notice before publishing this anywhere.

[dependencies]
anyhow = "1"
libc = "0.2"
prost = "0.14"
ratatui = "0.30"
serde_json = "1"
# Already in the lock file through ratatui-widgets, so this asks for two features and no
# new crate. RFC-3339 in and out of the status file, rather than hand-rolled calendar maths.
time = { version = "0.3", features = ["formatting", "parsing"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"
